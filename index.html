<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hitster – Generatore di Carte</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <!-- QR Code library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d1a; color: white; font-family: Georgia, serif; }
    button { font-family: Georgia, serif; }
    .qr-container canvas, .qr-container img { width: 80px !important; height: 80px !important; border-radius: 8px; }
  </style>
</head>
<body>
<div id="root"></div>

<script>
  const GROQ_API_KEY = "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";
</script>

<script type="text/babel">
const { useState, useCallback, useEffect, useRef } = React;

const GENRES = ["Pop","Rock","Hip-Hop","Dance","R&B/Soul","Italiana","Metal","Indie","Anni 70","Anni 80","Anni 90","Anni 2000","Anni 2010+"];
const DECADES = ["tutti","1950s","1960s","1970s","1980s","1990s","2000s","2010s","2020s"];
const COUNTS = [3, 5, 8, 10];

const CARD_COLORS = [
  { bg:"#FF6B35", text:"#fff",    accent:"#FFD700" },
  { bg:"#1A1A2E", text:"#E94560", accent:"#FFD700" },
  { bg:"#F7DC6F", text:"#1A1A2E", accent:"#E74C3C" },
  { bg:"#2ECC71", text:"#fff",    accent:"#fff"    },
  { bg:"#9B59B6", text:"#fff",    accent:"#F7DC6F" },
  { bg:"#E74C3C", text:"#fff",    accent:"#F7DC6F" },
  { bg:"#3498DB", text:"#fff",    accent:"#FFD700" },
  { bg:"#1ABC9C", text:"#fff",    accent:"#fff"    },
];

/* QR Code component */
function QRCode({ artist, title }) {
  const ref = useRef(null);
  const query = encodeURIComponent(`${artist} ${title}`);
  const spotifyUrl = `https://open.spotify.com/search/${query}`;

  useEffect(() => {
    if (ref.current && window.QRCode) {
      ref.current.innerHTML = "";
      new window.QRCode(ref.current, {
        text: spotifyUrl,
        width: 80,
        height: 80,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: window.QRCode.CorrectLevel.M,
      });
    }
  }, [spotifyUrl]);

  return (
    <div style={{ display:"flex", flexDirection:"column", alignItems:"center", marginTop:10, position:"relative" }}>
      <div ref={ref} className="qr-container" style={{ background:"#fff", padding:4, borderRadius:8 }} />
      <div style={{ fontSize:9, marginTop:4, opacity:0.7, letterSpacing:1 }}>▶ SPOTIFY</div>
    </div>
  );
}

/* Card component */
function HitsterCard({ card, colorIdx, flipped, onClick }) {
  const c = CARD_COLORS[colorIdx % CARD_COLORS.length];
  const face = {
    position:"absolute", inset:0, backfaceVisibility:"hidden", borderRadius:18,
    display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
    padding:"16px 18px", textAlign:"center",
  };
  return (
    <div onClick={onClick} style={{ cursor:"pointer", perspective:"1000px", width:220, height:360, flexShrink:0 }}>
      <div style={{
        width:"100%", height:"100%", position:"relative", transformStyle:"preserve-3d",
        transition:"transform 0.65s cubic-bezier(.4,0,.2,1)",
        transform: flipped ? "rotateY(180deg)" : "rotateY(0deg)",
        borderRadius:18, boxShadow:"0 10px 36px rgba(0,0,0,0.5)",
      }}>
        {/* FRONTE */}
        <div style={{ ...face, background:"#1A1A2E", border:"3px solid #E94560" }}>
          <div style={{ fontSize:56, marginBottom:10 }}>🎵</div>
          <div style={{ fontFamily:"Impact,cursive", fontSize:30, letterSpacing:5, color:"#E94560" }}>HITSTER</div>
          <div style={{ marginTop:18, fontSize:12, color:"#555", letterSpacing:2 }}>CLICCA PER GIRARE</div>
        </div>
        {/* RETRO */}
        <div style={{ ...face, background:c.bg, transform:"rotateY(180deg)", border:`3px solid ${c.accent}`, overflow:"hidden", justifyContent:"flex-start", paddingTop:22 }}>
          <div style={{ position:"absolute", top:-35, right:-35, width:110, height:110, borderRadius:"50%", background:`${c.accent}1a` }} />

          <div style={{ fontFamily:"Impact,cursive", fontSize:58, color:c.accent, lineHeight:1, marginBottom:6, position:"relative", textShadow:"0 3px 10px rgba(0,0,0,0.25)" }}>
            {card.year}
          </div>
          <div style={{ fontSize:15, fontWeight:700, color:c.text, lineHeight:1.3, marginBottom:6, position:"relative" }}>
            "{card.title}"
          </div>
          <div style={{ fontFamily:"monospace", fontSize:12, color:c.text, opacity:.85, textTransform:"uppercase", letterSpacing:2, position:"relative", marginBottom:4 }}>
            {card.artist}
          </div>
          {card.genre && (
            <div style={{ padding:"3px 11px", borderRadius:20, border:`1px solid ${c.text}55`, fontSize:11, color:c.text, opacity:.75, letterSpacing:1, position:"relative", marginBottom:4 }}>
              {card.genre}
            </div>
          )}
          {/* QR CODE SPOTIFY */}
          <div onClick={e => e.stopPropagation()}>
            <QRCode artist={card.artist} title={card.title} />
          </div>
        </div>
      </div>
    </div>
  );
}

/* Main App */
function App() {
  const [cards,   setCards]   = useState([]);
  const [flipped, setFlipped] = useState({});
  const [loading, setLoading] = useState(false);
  const [error,   setError]   = useState(null);
  const [genres,  setGenres]  = useState([]);
  const [decade,  setDecade]  = useState("tutti");
  const [count,   setCount]   = useState(5);

  const toggleGenre = g => setGenres(p => p.includes(g) ? p.filter(x => x !== g) : [...p, g]);

  const generate = useCallback(async () => {
    setLoading(true); setError(null); setFlipped({});
    try {
      const gt = genres.length ? `Generi: ${genres.join(", ")}.` : "Qualsiasi genere famoso.";
      const dt = decade !== "tutti" ? `Solo canzoni degli anni ${decade}.` : "Dal 1950 ad oggi.";
      const prompt = `Sei un esperto musicale. Genera esattamente ${count} carte per il gioco Hitster.\n${gt}\n${dt}\nCanzoni REALI e famose, mix italiano/internazionale.\nRispondi SOLO con un array JSON, zero testo extra, zero markdown.\n[{"artist":"...","title":"...","year":XXXX,"genre":"..."}]`;

      const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${GROQ_API_KEY}`
        },
        body: JSON.stringify({
          model: "llama-3.3-70b-versatile",
          messages: [{ role: "user", content: prompt }],
          temperature: 0.9,
          max_tokens: 1200,
        })
      });
      const data = await res.json();
      if (data.error) throw new Error(data.error.message);
      const raw = data.choices[0].message.content;
      setCards(JSON.parse(raw.replace(/```json|```/g, "").trim()));
    } catch(e) {
      setError("❌ " + e.message);
    } finally {
      setLoading(false);
    }
  }, [genres, decade, count]);

  const flipAll = () => {
    const allFlipped = cards.every((_, i) => flipped[i]);
    const n = {}; cards.forEach((_, i) => n[i] = !allFlipped); setFlipped(n);
  };

  const Chip = ({ active, onClick, children, color="#E94560", activeBg, activeColor="#fff" }) => (
    <button onClick={onClick} style={{
      padding:"5px 13px", borderRadius:20, cursor:"pointer", fontSize:13, transition:"all .2s",
      border:`2px solid ${active ? color : "#2a2a3a"}`,
      background: active ? (activeBg || color) : "transparent",
      color: active ? activeColor : "#777",
    }}>{children}</button>
  );

  return (
    <div style={{ minHeight:"100vh", background:"#0d0d1a", paddingBottom:70 }}>

      {/* HEADER */}
      <div style={{ background:"linear-gradient(160deg,#1A1A2E,#16213E)", borderBottom:"3px solid #E94560", padding:"32px 20px 24px", textAlign:"center" }}>
        <div style={{ fontSize:50 }}>🎶</div>
        <div style={{ fontFamily:"Impact,cursive", fontSize:52, letterSpacing:7, color:"#E94560", lineHeight:1 }}>HITSTER</div>
        <div style={{ color:"#555", fontSize:13, letterSpacing:2, marginTop:6, fontStyle:"italic" }}>generatore di nuove carte • QR Spotify incluso</div>
      </div>

      {/* CONTROLLI */}
      <div style={{ maxWidth:680, margin:"0 auto", padding:"28px 18px 0" }}>

        <div style={{ marginBottom:18 }}>
          <div style={{ color:"#E94560", fontSize:11, letterSpacing:3, textTransform:"uppercase", marginBottom:9, fontFamily:"monospace" }}>Genere (opzionale)</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:7 }}>
            {GENRES.map(g => <Chip key={g} active={genres.includes(g)} onClick={() => toggleGenre(g)}>{g}</Chip>)}
          </div>
        </div>

        <div style={{ marginBottom:18 }}>
          <div style={{ color:"#E94560", fontSize:11, letterSpacing:3, textTransform:"uppercase", marginBottom:9, fontFamily:"monospace" }}>Decennio</div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:7 }}>
            {DECADES.map(d => <Chip key={d} active={decade===d} onClick={() => setDecade(d)} color="#FFD700" activeBg="#FFD700" activeColor="#1A1A2E">{d}</Chip>)}
          </div>
        </div>

        <div style={{ marginBottom:24, display:"flex", alignItems:"center", gap:14 }}>
          <div style={{ color:"#E94560", fontSize:11, letterSpacing:3, textTransform:"uppercase", fontFamily:"monospace" }}>Carte:</div>
          {COUNTS.map(n => (
            <button key={n} onClick={() => setCount(n)} style={{
              width:42, height:42, borderRadius:9, cursor:"pointer", fontWeight:700, fontSize:16, transition:"all .2s",
              border:`2px solid ${count===n ? "#E94560" : "#2a2a3a"}`,
              background: count===n ? "#E94560" : "transparent",
              color: count===n ? "#fff" : "#777",
            }}>{n}</button>
          ))}
        </div>

        <button onClick={generate} disabled={loading} style={{
          width:"100%", padding:"17px", borderRadius:13, border:"none",
          cursor: loading ? "not-allowed" : "pointer",
          background: loading ? "#1a1a1a" : "linear-gradient(135deg,#E94560,#b5112e)",
          color:"#fff", fontFamily:"Impact,cursive", fontSize:23, letterSpacing:5,
          boxShadow: loading ? "none" : "0 5px 22px rgba(233,69,96,.4)",
          transition:"all .2s",
        }}>
          {loading ? "⏳  RICERCA IN CORSO…" : "🎵  GENERA CARTE"}
        </button>

        {error && <div style={{ marginTop:12, color:"#E94560", textAlign:"center", fontSize:13 }}>{error}</div>}
      </div>

      {/* CARTE */}
      {cards.length > 0 && (
        <div style={{ maxWidth:820, margin:"36px auto 0", padding:"0 18px" }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18 }}>
            <div style={{ color:"#444", fontSize:13, fontStyle:"italic" }}>{cards.length} carte — clicca per girare • scansiona QR per Spotify</div>
            <button onClick={flipAll} style={{ padding:"7px 16px", borderRadius:8, border:"2px solid #FFD700", background:"transparent", color:"#FFD700", fontSize:12, cursor:"pointer", letterSpacing:1, whiteSpace:"nowrap" }}>
              {cards.every((_,i) => flipped[i]) ? "↩ NASCONDI" : "👁 MOSTRA TUTTE"}
            </button>
          </div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:20, justifyContent:"center" }}>
            {cards.map((card, i) => (
              <HitsterCard key={i} card={card} colorIdx={i} flipped={!!flipped[i]}
                onClick={() => setFlipped(p => ({ ...p, [i]: !p[i] }))} />
            ))}
          </div>
        </div>
      )}

      {cards.length === 0 && !loading && (
        <div style={{ textAlign:"center", marginTop:60, color:"#2a2a3a", fontSize:15, fontStyle:"italic" }}>
          Scegli i filtri e premi Genera Carte 🎶
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
