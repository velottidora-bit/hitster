<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hitster – Generatore di Carte</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d1a; color: white; font-family: Georgia, serif; min-height: 100vh; }

    /* HEADER */
    .header { background: linear-gradient(160deg,#1A1A2E,#16213E); border-bottom: 3px solid #E94560; padding: 32px 20px 24px; text-align: center; }
    .header .emoji { font-size: 50px; }
    .header h1 { font-family: Impact, cursive; font-size: 52px; letter-spacing: 7px; color: #E94560; line-height: 1; }
    .header p { color: #555; font-size: 13px; letter-spacing: 2px; margin-top: 6px; font-style: italic; }

    /* CONTROLS */
    .controls { max-width: 680px; margin: 0 auto; padding: 28px 18px 0; }
    .section-title { color: #E94560; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 9px; font-family: monospace; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 18px; }
    .chip { padding: 5px 13px; border-radius: 20px; cursor: pointer; font-size: 13px; border: 2px solid #2a2a3a; background: transparent; color: #777; font-family: Georgia, serif; transition: all .2s; }
    .chip.active-red { border-color: #E94560; background: #E94560; color: #fff; }
    .chip.active-yellow { border-color: #FFD700; background: #FFD700; color: #1A1A2E; font-weight: 700; }
    .count-row { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
    .count-btn { width: 42px; height: 42px; border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 16px; border: 2px solid #2a2a3a; background: transparent; color: #777; transition: all .2s; }
    .count-btn.active { border-color: #E94560; background: #E94560; color: #fff; }
    .gen-btn { width: 100%; padding: 17px; border-radius: 13px; border: none; cursor: pointer; background: linear-gradient(135deg,#E94560,#b5112e); color: #fff; font-family: Impact, cursive; font-size: 23px; letter-spacing: 5px; box-shadow: 0 5px 22px rgba(233,69,96,.4); transition: all .2s; }
    .gen-btn:disabled { background: #1a1a1a; box-shadow: none; cursor: not-allowed; }
    .error { margin-top: 12px; color: #E94560; text-align: center; font-size: 13px; }

    /* CARDS AREA */
    .cards-area { max-width: 820px; margin: 36px auto 0; padding: 0 18px 60px; }
    .cards-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .cards-header span { color: #444; font-size: 13px; font-style: italic; }
    .show-all-btn { padding: 7px 16px; border-radius: 8px; border: 2px solid #FFD700; background: transparent; color: #FFD700; font-size: 12px; cursor: pointer; letter-spacing: 1px; white-space: nowrap; }
    .cards-grid { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; }
    .empty { text-align: center; margin-top: 60px; color: #2a2a3a; font-size: 15px; font-style: italic; }

    /* CARD FLIP */
    .card-wrap { cursor: pointer; perspective: 1000px; width: 220px; height: 370px; flex-shrink: 0; }
    .card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.65s cubic-bezier(.4,0,.2,1); border-radius: 18px; box-shadow: 0 10px 36px rgba(0,0,0,0.5); }
    .card-wrap.flipped .card-inner { transform: rotateY(180deg); }
    .card-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px 18px; text-align: center; }
    .card-front { background: #1A1A2E; border: 3px solid #E94560; }
    .card-front .icon { font-size: 56px; margin-bottom: 10px; }
    .card-front .brand { font-family: Impact, cursive; font-size: 30px; letter-spacing: 5px; color: #E94560; }
    .card-front .hint { margin-top: 18px; font-size: 12px; color: #555; letter-spacing: 2px; }
    .card-back { transform: rotateY(180deg); overflow: hidden; justify-content: flex-start; padding-top: 20px; }
    .card-back .deco { position: absolute; top: -35px; right: -35px; width: 110px; height: 110px; border-radius: 50%; }
    .card-back .year { font-family: Impact, cursive; font-size: 58px; line-height: 1; margin-bottom: 6px; position: relative; text-shadow: 0 3px 10px rgba(0,0,0,0.25); }
    .card-back .title { font-size: 15px; font-weight: 700; line-height: 1.3; margin-bottom: 6px; position: relative; }
    .card-back .artist { font-family: monospace; font-size: 12px; opacity: .85; text-transform: uppercase; letter-spacing: 2px; position: relative; margin-bottom: 4px; }
    .card-back .genre-tag { padding: 3px 11px; border-radius: 20px; font-size: 11px; opacity: .75; letter-spacing: 1px; position: relative; margin-bottom: 8px; }
    .qr-wrap { display: flex; flex-direction: column; align-items: center; margin-top: 6px; }
    .qr-box { background: #fff; padding: 4px; border-radius: 8px; }
    .qr-box canvas, .qr-box img { width: 75px !important; height: 75px !important; border-radius: 6px; display: block; }
    .qr-label { font-size: 9px; margin-top: 4px; opacity: 0.7; letter-spacing: 1px; }
  </style>
</head>
<body>

<div class="header">
  <div class="emoji">🎶</div>
  <h1>HITSTER</h1>
  <p>generatore di nuove carte • QR Spotify incluso</p>
</div>

<div class="controls">
  <div class="section-title">Genere (opzionale)</div>
  <div class="chips" id="genre-chips"></div>

  <div class="section-title">Decennio</div>
  <div class="chips" id="decade-chips"></div>

  <div class="section-title">Carte</div>
  <div class="count-row" id="count-row"></div>

  <button class="gen-btn" id="gen-btn" onclick="generate()">🎵  GENERA CARTE</button>
  <div class="error" id="error"></div>
</div>

<div class="cards-area" id="cards-area" style="display:none">
  <div class="cards-header">
    <span id="cards-count"></span>
    <button class="show-all-btn" onclick="toggleAll()">👁 MOSTRA TUTTE</button>
  </div>
  <div class="cards-grid" id="cards-grid"></div>
</div>

<div class="empty" id="empty">Scegli i filtri e premi Genera Carte 🎶</div>

<script>
const GROQ_API_KEY = "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";

const GENRES = ["Pop","Rock","Hip-Hop","Dance","R&B/Soul","Italiana","Metal","Indie","Anni 70","Anni 80","Anni 90","Anni 2000","Anni 2010+"];
const DECADES = ["tutti","1950s","1960s","1970s","1980s","1990s","2000s","2010s","2020s"];
const COUNTS = [3,5,8,10];
const COLORS = [
  {bg:"#FF6B35",text:"#fff",accent:"#FFD700"},
  {bg:"#1A1A2E",text:"#E94560",accent:"#FFD700"},
  {bg:"#F7DC6F",text:"#1A1A2E",accent:"#E74C3C"},
  {bg:"#2ECC71",text:"#fff",accent:"#fff"},
  {bg:"#9B59B6",text:"#fff",accent:"#F7DC6F"},
  {bg:"#E74C3C",text:"#fff",accent:"#F7DC6F"},
  {bg:"#3498DB",text:"#fff",accent:"#FFD700"},
  {bg:"#1ABC9C",text:"#fff",accent:"#fff"},
];

let selectedGenres = [];
let selectedDecade = "tutti";
let selectedCount = 5;
let cards = [];
let allFlipped = false;

// Build genre chips
const gc = document.getElementById("genre-chips");
GENRES.forEach(g => {
  const b = document.createElement("button");
  b.className = "chip"; b.textContent = g;
  b.onclick = () => {
    if (selectedGenres.includes(g)) { selectedGenres = selectedGenres.filter(x=>x!==g); b.className="chip"; }
    else { selectedGenres.push(g); b.className="chip active-red"; }
  };
  gc.appendChild(b);
});

// Build decade chips
const dc = document.getElementById("decade-chips");
DECADES.forEach(d => {
  const b = document.createElement("button");
  b.className = "chip" + (d==="tutti"?" active-yellow":""); b.textContent = d;
  b.onclick = () => {
    document.querySelectorAll("#decade-chips .chip").forEach(x=>x.className="chip");
    b.className="chip active-yellow";
    selectedDecade = d;
  };
  dc.appendChild(b);
});

// Build count buttons
const cr = document.getElementById("count-row");
const lbl = document.createElement("div");
lbl.className="section-title"; lbl.style.marginBottom="0";
COUNTS.forEach(n => {
  const b = document.createElement("button");
  b.className = "count-btn" + (n===5?" active":""); b.textContent = n;
  b.onclick = () => {
    document.querySelectorAll(".count-btn").forEach(x=>x.className="count-btn");
    b.className="count-btn active"; selectedCount=n;
  };
  cr.appendChild(b);
});

async function generate() {
  const btn = document.getElementById("gen-btn");
  const errEl = document.getElementById("error");
  btn.disabled = true; btn.textContent = "⏳  RICERCA IN CORSO…";
  errEl.textContent = "";

  try {
    const gt = selectedGenres.length ? "Generi: "+selectedGenres.join(", ")+"." : "Qualsiasi genere famoso.";
    const dt = selectedDecade !== "tutti" ? "Solo canzoni degli anni "+selectedDecade+"." : "Dal 1950 ad oggi.";
    const prompt = `Sei un esperto musicale. Genera esattamente ${selectedCount} carte per il gioco Hitster.\n${gt}\n${dt}\nCanzoni REALI e famose, mix italiano/internazionale.\nRispondi SOLO con un array JSON, zero testo extra, zero markdown.\n[{"artist":"...","title":"...","year":2000,"genre":"..."}]`;

    const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+GROQ_API_KEY},
      body:JSON.stringify({model:"llama-3.3-70b-versatile",messages:[{role:"user",content:prompt}],temperature:0.9,max_tokens:1200})
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error.message);
    const raw = data.choices[0].message.content;
    cards = JSON.parse(raw.replace(/```json|```/g,"").trim());
    renderCards();
  } catch(e) {
    errEl.textContent = "❌ " + e.message;
  } finally {
    btn.disabled=false; btn.textContent="🎵  GENERA CARTE";
  }
}

function renderCards() {
  allFlipped = false;
  document.querySelector(".show-all-btn").textContent = "👁 MOSTRA TUTTE";
  const grid = document.getElementById("cards-grid");
  grid.innerHTML = "";
  document.getElementById("cards-area").style.display = "block";
  document.getElementById("empty").style.display = "none";
  document.getElementById("cards-count").textContent = cards.length + " carte — tocca per girare • scansiona QR per Spotify";

  cards.forEach((card, i) => {
    const c = COLORS[i % COLORS.length];
    const wrap = document.createElement("div");
    wrap.className = "card-wrap";
    wrap.onclick = () => wrap.classList.toggle("flipped");

    wrap.innerHTML = `
      <div class="card-inner">
        <div class="card-face card-front">
          <div class="icon">🎵</div>
          <div class="brand">HITSTER</div>
          <div class="hint">TOCCA PER GIRARE</div>
        </div>
        <div class="card-face card-back" style="background:${c.bg};border:3px solid ${c.accent}">
          <div class="deco" style="background:${c.accent}1a"></div>
          <div class="year" style="color:${c.accent}">${card.year}</div>
          <div class="title" style="color:${c.text}">"${card.title}"</div>
          <div class="artist" style="color:${c.text}">${card.artist}</div>
          ${card.genre ? `<div class="genre-tag" style="color:${c.text};border:1px solid ${c.text}55">${card.genre}</div>` : ""}
          <div class="qr-wrap" id="qr-${i}">
            <div class="qr-box" id="qrbox-${i}"></div>
            <div class="qr-label" style="color:${c.text}">▶ SPOTIFY</div>
          </div>
        </div>
      </div>`;

    grid.appendChild(wrap);

    // Generate QR
    setTimeout(() => {
      const query = encodeURIComponent(card.artist + " " + card.title);
      const url = "https://open.spotify.com/search/" + query;
      try {
        new QRCode(document.getElementById("qrbox-"+i), {
          text: url, width:75, height:75,
          colorDark:"#000000", colorLight:"#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      } catch(e) {}
    }, 100 * i);
  });
}

function toggleAll() {
  allFlipped = !allFlipped;
  document.querySelectorAll(".card-wrap").forEach(c => {
    if (allFlipped) c.classList.add("flipped");
    else c.classList.remove("flipped");
  });
  document.querySelector(".show-all-btn").textContent = allFlipped ? "↩ NASCONDI" : "👁 MOSTRA TUTTE";
}
</script>
</body>
</html>
